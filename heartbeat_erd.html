
<style>
#erd svg { width: 100%; }
.db-label { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 8px; font-family: monospace; padding: 4px 10px; border-radius: 4px; display: inline-block; }
.db-section { margin-bottom: 24px; padding: 16px; border: 1px solid var(--color-border-tertiary); border-radius: 12px; }
.db-general { border-color: var(--color-border-info); background: var(--color-background-info); }
.db-sensitive { border-color: var(--color-border-danger); background: var(--color-background-danger); }
</style>

<div style="margin-bottom:12px">
  <div style="display:flex;gap:16px;font-size:12px;color:var(--color-text-secondary);margin-bottom:16px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--color-background-info);border:1px solid var(--color-border-info);display:inline-block"></span>일반 DB (5432) — 비민감 데이터</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--color-background-danger);border:1px solid var(--color-border-danger);display:inline-block"></span>민감 DB (5433) — 암호화 저장 필수</span>
  </div>
</div>

<div id="erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: 'sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    background: 'transparent',
    primaryColor: dark ? '#1e2030' : '#f0f4ff',
    primaryBorderColor: dark ? '#4a5580' : '#93b4e8',
  },
});

const diagram = `erDiagram
  USERS {
    uuid id PK
    string email UK
    string nickname
    string hashed_password
    string phone_number
    string role "user/guardian/admin"
    boolean is_active
    timestamp created_at
    timestamp last_login_at
  }

  SESSIONS {
    uuid id PK
    uuid user_id FK
    string access_token
    string refresh_token
    timestamp expires_at
    string ip_address
    timestamp created_at
  }

  GUARDIAN_CONSENTS {
    uuid id PK
    uuid user_id FK
    string guardian_phone
    boolean is_active
    timestamp consented_at
    timestamp revoked_at
  }

  DIAGNOSES {
    uuid id PK
    uuid user_id FK
    integer phq9_score
    integer gad7_score
    string phq9_severity "none/mild/moderate/severe"
    string gad7_severity "none/mild/moderate/severe"
    jsonb compound_flags
    string selected_prompt_key
    timestamp created_at
  }

  CONVERSATIONS {
    uuid id PK
    uuid session_id FK
    uuid user_id FK
    string role "user/assistant"
    text encrypted_content
    string encryption_key_id
    float crisis_score
    timestamp created_at
  }

  COUNSELING_SESSIONS {
    uuid id PK
    uuid user_id FK
    uuid diagnosis_id FK
    string persona_type "empathy/coaching/neutral"
    timestamp started_at
    timestamp ended_at
    boolean is_active
  }

  CRISIS_EVENTS {
    uuid id PK
    uuid user_id FK
    uuid conversation_id FK
    float crisis_score
    string severity "info/warning/crisis"
    string action_taken
    boolean guardian_notified
    boolean resolved
    timestamp occurred_at
  }

  SUMMARIES {
    uuid id PK
    uuid session_id FK
    uuid user_id FK
    text main_complaint
    string risk_level "low/medium/high"
    boolean suicidal_mentioned
    text core_topics
    text next_session_notes
    string prompt_adjustment
    timestamp created_at
  }

  VOICE_FILES {
    uuid id PK
    uuid conversation_id FK
    string s3_path
    string encryption_key_id
    integer duration_seconds
    date retention_until
    timestamp created_at
  }

  AUDIT_LOGS {
    uuid id PK
    uuid user_id FK
    string action
    string resource_type
    uuid resource_id
    string ip_address
    timestamp created_at
  }

  USERS ||--o{ SESSIONS : "로그인"
  USERS ||--o{ GUARDIAN_CONSENTS : "보호자 등록"
  USERS ||--o{ DIAGNOSES : "진단 이력"
  USERS ||--o{ COUNSELING_SESSIONS : "상담 세션"
  USERS ||--o{ CRISIS_EVENTS : "위기 이벤트"
  USERS ||--o{ AUDIT_LOGS : "접근 로그"
  COUNSELING_SESSIONS ||--o{ CONVERSATIONS : "대화 내역"
  COUNSELING_SESSIONS ||--o| SUMMARIES : "상담 요약"
  COUNSELING_SESSIONS }o--|| DIAGNOSES : "진단 기반"
  CONVERSATIONS ||--o{ VOICE_FILES : "음성 파일"
  CONVERSATIONS ||--o{ CRISIS_EVENTS : "위기 감지"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
